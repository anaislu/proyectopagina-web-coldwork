name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el workflow solo lee el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web: ['apps/web/**']
            api: ['apps/api/**']
            ai: ['apps/ai/**']
            infra: ['docker-compose*.yml', '.github/workflows/**', 'supabase/**']

  web:
    name: Angular · build
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  api:
    name: NestJS · lint, test, build
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npm test -- --ci
      - run: npm run build

  ai:
    name: FastAPI · lint, test
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          AI_INTERNAL_TOKEN: ci-only-token-0123456789abcdef0123456789abcdef

  docker:
    name: Docker · build ${{ matrix.service }}
    needs: [web, api, ai]
    # Corre si los jobs previos pasaron o se saltaron (no si alguno falló).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, ai]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          target: runtime
          push: false
          tags: coldwork-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: |
          cp .env.example .env
          echo "ci" > secrets/ai_internal_token
          docker compose -f docker-compose.yml config --quiet
          docker compose config --quiet
